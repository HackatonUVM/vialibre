name: Compilar APK Android (VíaLibre)

on:
  workflow_dispatch: # Permite compilar manualmente con un clic en GitHub
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    name: Compilar APK Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Instalar dependencias Flutter
        run: |
          cd mobile
          flutter pub get

      - name: Compilar APK en Release
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY || '' }}
          MAPS_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_KEY || secrets.GOOGLE_MAPS_API_KEY || '' }}
          GOOGLE_MAPS_ANDROID_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_KEY || secrets.GOOGLE_MAPS_API_KEY || '' }}
        run: |
          cd mobile
          if [ -n "$MAPS_KEY" ]; then
            echo "MAPS_API_KEY=${MAPS_KEY}" >> android/local.properties
          fi
          flutter build apk --release --no-tree-shake-icons \
            --dart-define=BFF_BASE_URL=https://bff-steel.vercel.app \
            --dart-define=SUPABASE_URL=https://aiztivgrynirvdkcdugd.supabase.co \
            --dart-define=SUPABASE_ANON_KEY="${SUPABASE_KEY}" \
            --dart-define=GOOGLE_MAPS_ANDROID_KEY="${MAPS_KEY}"

      - name: Publicar APK para descarga directa como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vialibre-android-release
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Actualizar binario en GitHub Release v1.0.0-mvp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0-mvp mobile/build/app/outputs/flutter-apk/app-release.apk --clobber || true
