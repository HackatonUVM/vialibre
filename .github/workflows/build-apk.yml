name: Compilar APK Android (VíaLibre)

on:
  workflow_dispatch: # Permite compilar manualmente con un clic en GitHub
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    name: Compilar APK Release
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Descargar dependencias de Flutter
        run: |
          cd mobile
          flutter pub get

      - name: Compilar APK en Release
        run: |
          cd mobile
          flutter build apk --release --no-tree-shake-icons

      - name: Publicar APK para descarga directa
        uses: actions/upload-artifact@v4
        with:
          name: vialibre-android-release
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
