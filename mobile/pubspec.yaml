name: vialibre
description: "VíaLibre — Movilidad peatonal y transporte público accesible, reporte ciudadano e información en Lenguaje Claro."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Estado y navegación
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Mapas y ubicación
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.2
  permission_handler: ^11.3.1

  # Supabase (Auth anónimo/opcional, Realtime, Storage) y red BFF
  supabase_flutter: ^2.8.0
  http: ^1.2.2

  # Multimedia, limpieza EXIF y documentos
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  record: ^6.0.0
  audioplayers: ^6.1.0
  flutter_tts: ^4.2.0
  file_picker: ^10.0.0

  # Persistencia offline y utilidades
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.0
  connectivity_plus: ^6.1.0
  shared_preferences: ^2.3.3
  uuid: ^4.5.1

  # Tipografía del sistema de diseño (Inter)
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/markers/
    - assets/branding/
